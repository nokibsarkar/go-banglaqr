name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -shuffle=on -count=1 -coverprofile=cover.out ./...
      - name: Require 100% coverage
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "coverage: $total"
          [ "$total" = "100.0%" ]
      # Staticcheck must be built by a Go at least as new as the code it reads.
      - if: ${{ matrix.go == 'stable' }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - if: ${{ matrix.go == 'stable' }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Fuzz smoke
        run: |
          go test -run '^$' -fuzz FuzzParse -fuzztime 20s
          go test -run '^$' -fuzz FuzzDecode -fuzztime 20s
          go test -run '^$' -fuzz FuzzGenerate -fuzztime 20s
